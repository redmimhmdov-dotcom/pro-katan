<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">katanbuild — تفاصيل المنتج</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="section" style="padding-top:56px;">
      <div class="container">
        <a href="products.html" class="mono" data-i18n="back_to_products"
          style="font-size:.85rem;color:var(--text-muted);display:inline-block;margin-bottom:28px;"></a>

        <div class="detail-layout">
          <div class="detail-main" id="detailMain"></div>

          <aside class="sidebar">
            <h4 data-i18n="detail_sidebar_title"></h4>
            <div id="sidebarList"></div>
          </aside>
        </div>
      </div>
    </section>

    <section class="strip">
      <div class="container strip-row">
        <span class="mono" data-i18n="strip_title" style="color:var(--text-muted);font-size:.85rem;"></span>
        <div class="strip-links" id="stripLinks"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function currentSlug() {
      const params = new URLSearchParams(location.search);
      return params.get("slug") || window.SITE.products[0].slug;
    }

    function renderDetail() {
      const lang = window.currentLang();
      const S = window.SITE;
      const slug = currentSlug();
      const product = S.products.find((p) => p.slug === slug) || S.products[0];

      document.title = `katanbuild — ${product.title[lang]}`;

      document.getElementById("detailMain").innerHTML = `
      <span class="cat-tag mono">${product.category[lang]}</span>
      <button class="btn btn-primary" type="button" data-cart-slug="${product.slug}" data-cart-title="${product.title[lang]}">أضف إلى الطلبية</button>
      <h1>${product.title[lang]}</h1>
      <div class="thumb-lg" style="background-image:url('${S.media.productImages[S.products.indexOf(product)]}')"></div>
      <p class="lede">${product.short[lang]}</p>
      <p class="desc">${product.details[lang]}</p>
      <div class="spec-list">
        <h4 class="mono" style="color:var(--text-muted);font-size:.8rem;margin-bottom:6px;">${window.t("detail_specs")}</h4>
        ${product.specs
          .map((s) => `<div class="row"><span>${s[lang]}</span><span>${s.val[lang]}</span></div>`)
          .join("")}
      </div>
        <section class="section-products">
          <div class="section-head"><div class="eyebrow">${lang === "ar" ? "مواد القسم" : "Section products"}</div><h2>${lang === "ar" ? `المواد الموجودة داخل القسم (${product.items.length})` : `Products inside this section (${product.items.length})`}</h2></div>
          <div class="product-grid">${product.items.map((item) => `<article class="product-card section-product-card"><div class="thumb" style="background-image:url('${S.media.productImages[item.imageIndex]}')"><span class="cat">${product.category[lang]}</span></div><div class="body"><h3>${item.title[lang]}</h3><p>${lang === "ar" ? "مادة متخصصة ضمن هذا القسم، مع مواصفات تطبيق واضحة." : "A specialized material within this section with clear application guidance."}</p><button class="btn btn-primary" type="button" data-cart-slug="${item.slug}" data-cart-title="${item.title[lang]}">${lang === "ar" ? "أضف للطلبية" : "Add to order"}</button></div></article>`).join("")}</div>
        </section>
        <section class="quantity-tool" aria-labelledby="quantityTitle">
          <div class="eyebrow">PROJECT ESTIMATOR</div>
          <h2 id="quantityTitle">حاسبة الكمية وعرض السعر</h2>
          <p>أدخل المساحة لتقدير الكمية مع نسبة هدر اختيارية.</p>
          <div class="quantity-grid">
            <label>المساحة بالمتر المربع<input id="areaInput" type="number" min="0" step="0.1" value="20"></label>
            <label>نسبة الهدر<input id="wasteInput" type="number" min="0" max="50" step="1" value="10"></label>
          </div>
          <div class="estimate-result" id="estimateResult" role="status"></div>
          <button class="btn btn-outline" id="printQuote" type="button">طباعة عرض سعر مبدئي</button>
        </section>
    `;

      document.getElementById("sidebarList").innerHTML = S.products
        .map(
          (p) => `
      <a href="product.html?slug=${p.slug}" class="${p.slug === product.slug ? "active" : ""}">
        <span>${p.category[lang]}</span>
        <span class="arrow">${lang === "ar" ? "←" : "→"}</span>
      </a>`
        )
        .join("");

      document.getElementById("stripLinks").innerHTML = S.products
        .filter((p) => p.slug !== product.slug)
        .map((p) => `<a href="product.html?slug=${p.slug}">${p.category[lang]}</a>`)
        .join("");
    }
    document.addEventListener("site:ready", renderDetail);
    document.addEventListener("site:refresh", renderDetail);
    document.addEventListener("site:ready", () => {
      const area = document.getElementById("areaInput");
      const waste = document.getElementById("wasteInput");
      const result = document.getElementById("estimateResult");
      const renderEstimate = () => {
        const quantity = Math.ceil((Number(area.value) || 0) * (1 + (Number(waste.value) || 0) / 100) / window.SITE.productTools.coverage);
        result.innerHTML = `<strong>${quantity}</strong> ${window.SITE.productTools.packageLabel.ar} تقريبًا <span>على أساس تغطية ${window.SITE.productTools.coverage} م² لكل عبوة.</span>`;
      };
      area.addEventListener("input", renderEstimate);
      waste.addEventListener("input", renderEstimate);
      renderEstimate();
      document.getElementById("printQuote").addEventListener("click", () => {
        const quantity = Math.ceil((Number(area.value) || 0) * (1 + (Number(waste.value) || 0) / 100) / window.SITE.productTools.coverage);
        const quote = window.open("", "_blank", "width=760,height=720");
        quote.document.write(`<html dir="rtl"><head><title>عرض سعر katanbuild</title></head><body><h1>katanbuild</h1><h2>عرض سعر مبدئي</h2><p>المادة: ${product.title.ar}</p><p>المساحة: ${area.value} م²</p><p>الكمية التقديرية: ${quantity} عبوة</p><p>للتأكيد والسعر النهائي: +9630952725590</p><p>تصميم وبرمجة من قبل محمد الحسين 0952725590</p><script>window.print()<\/script></body></html>`);
        quote.document.close();
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/cart.js"></script>
</body>

</html>
