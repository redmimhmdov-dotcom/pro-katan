<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>katanbuild — المنتجات</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="section" style="padding-top:56px;">
      <div class="container">
        <div class="section-head">
          <div class="eyebrow" data-i18n="products_eyebrow"></div>
          <h1 class="line-title" data-i18n="products_title" style="margin-top:16px;"></h1>
          <p data-i18n="products_sub"></p>
        </div>
        <section class="smart-guide" aria-labelledby="smartGuideTitle">
          <div class="eyebrow">KATANBUILD SMART GUIDE</div>
          <h2 id="smartGuideTitle">مساعد اختيار القسم</h2>
          <p>أجب عن سؤالين، وسنرشح لك القسم الأقرب لاستخدامك.</p>
          <div class="smart-guide-grid">
            <label>مكان الاستخدام<select id="guideUse">
                <option value="surface">سطح أو سطح مكشوف</option>
                <option value="wall">جدار أو واجهة</option>
                <option value="tile">بلاط أو سيراميك</option>
                <option value="inside">داخل المبنى</option>
              </select></label>
            <label>المشكلة الأساسية<select id="guideNeed">
                <option value="water">رطوبة أو تسرب</option>
                <option value="finish">تسوية أو تشطيب</option>
                <option value="bond">تثبيت البلاط</option>
                <option value="heat">حرارة أو عزل</option>
              </select></label>
          </div>
          <button class="btn btn-primary" id="guideButton" type="button">إظهار الترشيح</button>
          <p class="smart-result" id="guideResult" role="status"></p>
        </section>
        <div class="product-grid" id="allProducts"></div>
      </div>
    </section>

    <section class="strip">
      <div class="container strip-row">
        <span class="mono" data-i18n="strip_title" style="color:var(--text-muted);font-size:.85rem;"></span>
        <div class="strip-links" id="stripLinks"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderProducts() {
      const lang = window.currentLang();
      const S = window.SITE;

      document.getElementById("allProducts").innerHTML = S.products
        .map(
          (p) => `
      <a href="product.html?slug=${p.slug}" class="product-card">
        <div class="thumb" style="background-image:url('${S.media.productImages[S.products.indexOf(p)]}')"><span class="cat">${p.category[lang]}</span></div>
        <div class="body">
          <h3>${p.title[lang]}</h3>
          <p>${p.short[lang]}</p>
            <span class="product-count">${p.items.length} ${lang === "ar" ? "مواد داخل القسم" : "products in section"}</span>
          <span class="go">${window.t("view_category")} ${lang === "ar" ? "←" : "→"}</span>
          <button class="btn btn-primary" type="button" data-cart-slug="${p.slug}" data-cart-title="${p.title[lang]}">أضف للطلبية</button>
        </div>
      </a>`
        )
        .join("");

      document.getElementById("stripLinks").innerHTML = S.products
        .map((p) => `<a href="product.html?slug=${p.slug}">${p.category[lang]}</a>`)
        .join("");
    }
    document.addEventListener("site:ready", renderProducts);
    document.addEventListener("site:refresh", renderProducts);
    document.addEventListener("site:ready", () => {
      document.getElementById("guideButton").addEventListener("click", () => {
        const need = document.getElementById("guideNeed").value;
        const use = document.getElementById("guideUse").value;
        const slug = need === "bond" || use === "tile" ? "ceramic-adhesive-grout" : need === "water" || use === "surface" ? "waterproofing-materials" : need === "heat" ? "thermal-insulation-materials" : "render-plaster-materials";
        const product = window.SITE.products.find((item) => item.slug === slug);
        document.getElementById("guideResult").innerHTML = `الترشيح الأقرب: <a href="product.html?slug=${slug}">${product.title.ar}</a> — راجع المواصفات قبل الطلب.`;
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/cart.js"></script>
</body>

</html>
