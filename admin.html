<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة محاسبة katanbuild</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .admin-app {
            min-height: 100vh;
            background: var(--bg);
        }

        .admin-shell {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            min-height: 100vh;
        }

        .admin-sidebar {
            padding: 28px 18px;
            border-left: 1px solid var(--line);
            background: var(--surface);
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
            font-weight: 700;
        }

        .admin-brand img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .admin-nav {
            display: grid;
            gap: 8px;
        }

        .admin-nav button {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            padding: 12px 14px;
            border-radius: 8px;
            text-align: right;
            cursor: pointer;
            font: inherit;
        }

        .admin-nav button:hover,
        .admin-nav button.active {
            color: var(--text);
            background: var(--surface-2);
            border-color: var(--line);
        }

        .admin-main {
            padding: 28px clamp(18px, 4vw, 56px);
        }

        .admin-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .admin-topbar h1 {
            margin: 0;
        }

        .admin-user {
            color: var(--text-muted);
            font-size: .9rem;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .admin-stat,
        .admin-panel-card {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 8px;
            padding: 20px;
        }

        .admin-stat strong {
            display: block;
            font-size: 2rem;
            margin-top: 8px;
        }

        .admin-stat span {
            color: var(--text-muted);
        }

        .admin-panel-card h2 {
            margin-top: 0;
        }

        .admin-table-wrap {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 620px;
        }

        .admin-table th,
        .admin-table td {
            padding: 13px 10px;
            border-bottom: 1px solid var(--line);
            text-align: right;
        }

        .admin-table th {
            color: var(--text-muted);
            font-weight: 500;
        }

        .admin-login {
            width: min(440px, 100%);
            margin: 10vh auto;
        }

        .admin-login .admin-panel-card {
            padding: 30px;
        }

        .admin-field {
            display: grid;
            gap: 7px;
            margin: 16px 0;
        }

        .admin-field input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 12px;
            border-radius: 6px;
            font: inherit;
        }

        .admin-message {
            min-height: 24px;
            color: var(--accent, #d2a85a);
        }

        @media (max-width: 900px) {
            .admin-shell {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                border-left: 0;
                border-bottom: 1px solid var(--line);
            }

            .admin-nav {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .admin-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            .admin-topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-grid {
                grid-template-columns: 1fr;
            }

            .admin-nav {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <div id="adminRoot" class="admin-app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
